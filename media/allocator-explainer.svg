<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600"><style>.bg{fill:#080b0d}.g{stroke:#263138;opacity:.3}.h{fill:#d6ff45;font:bold 25px monospace}.t{fill:#eef3f1;font:14px monospace}.s{fill:#68e1d1;font:12px monospace}.m{fill:#9aa7a5;font:11px monospace}.p{fill:#10181d;stroke:#536169}@keyframes req{0%,15%{transform:translateX(0)}35%,55%{transform:translateX(210px)}80%,100%{transform:translateX(0)}}.req{animation:req 15s infinite}@keyframes co{0%,65%{opacity:.2}75%,90%{opacity:1}100%{opacity:.2}}</style><rect width="1100" height="600" class="bg"/><g><line x1="0" y1="0" x2="0" y2="600" class="g"/><line x1="100" y1="0" x2="100" y2="600" class="g"/><line x1="200" y1="0" x2="200" y2="600" class="g"/><line x1="300" y1="0" x2="300" y2="600" class="g"/><line x1="400" y1="0" x2="400" y2="600" class="g"/><line x1="500" y1="0" x2="500" y2="600" class="g"/><line x1="600" y1="0" x2="600" y2="600" class="g"/><line x1="700" y1="0" x2="700" y2="600" class="g"/><line x1="800" y1="0" x2="800" y2="600" class="g"/><line x1="900" y1="0" x2="900" y2="600" class="g"/><line x1="1000" y1="0" x2="1000" y2="600" class="g"/></g><text x="50" y="55" class="h">C · CUSTOM HEAP ALLOCATOR</text><text x="50" y="82" class="s">WHAT malloc/free ACTUALLY DO IN MEMORY</text><rect x="55" y="120" width="990" height="350" rx="8" class="p"/><g transform="translate(75 155)"><text class="s">malloc(64)</text><rect y="25" width="145" height="65" rx="7" fill="#11191e" stroke="#d6ff45"/><text x="72" y="62" text-anchor="middle" class="t">REQUEST</text></g><text x="310" y="155" class="s">FREE LIST · FIRST FIT</text><rect x="310" y="175" width="670" height="75" fill="#091013" stroke="#344047"/><rect x="330" y="195" width="110" height="35" fill="#17252a"/><rect x="450" y="195" width="170" height="35" fill="#17252a" stroke="#d6ff45"/><rect x="630" y="195" width="130" height="35" fill="#17252a"/><rect x="770" y="195" width="190" height="35" fill="#17252a"/><text x="535" y="218" text-anchor="middle" class="m">128 B SELECTED</text><g class="req"><circle cx="155" cy="207" r="7" fill="#d6ff45"/></g><path d="M220 207H450" stroke="#d6ff45" stroke-width="3" stroke-dasharray="9 9"/><text x="310" y="300" class="s">SPLIT BLOCK</text><rect x="310" y="320" width="670" height="60" fill="#091013" stroke="#344047"/><rect x="330" y="337" width="220" height="26" fill="#17252a" stroke="#d6ff45"/><rect x="550" y="337" width="25" height="26" fill="#0b1114"/><rect x="575" y="337" width="385" height="26" fill="#182027"/><text x="440" y="355" text-anchor="middle" class="t">64 B USED</text><text x="765" y="355" text-anchor="middle" class="m">64 B REMAINS FREE</text><g style="animation:co 15s infinite"><text x="310" y="425" class="s">free() → COALESCE</text><path d="M330 445h630" stroke="#d6ff45" stroke-width="10"/></g><text x="70" y="505" class="m">REQUEST → FIRST-FIT SEARCH → SPLIT → ALLOCATED BLOCK → free() → COALESCE</text><text x="70" y="535" class="m">This project visualizes the heap metadata and block transformations normally hidden behind libc.</text></svg>