<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600"><style>.bg{fill:#080b0d}.g{stroke:#263138;opacity:.3}.h{fill:#d6ff45;font:bold 25px monospace}.t{fill:#eef3f1;font:14px monospace}.s{fill:#68e1d1;font:12px monospace}.m{fill:#9aa7a5;font:11px monospace}.b{fill:#10181d;stroke:#536169}.x{fill:#d6ff45}@keyframes target{0%,20%{transform:translate(70px,20px)}45%,70%{transform:translate(0,0)}90%,100%{transform:translate(70px,20px)}}@keyframes stage{0%,55%{transform:translateX(0)}75%,90%{transform:translateX(55px)}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}</style><rect width="1100" height="600" class="bg"/><g><line x1="0" y1="0" x2="0" y2="600" class="g"/><line x1="100" y1="0" x2="100" y2="600" class="g"/><line x1="200" y1="0" x2="200" y2="600" class="g"/><line x1="300" y1="0" x2="300" y2="600" class="g"/><line x1="400" y1="0" x2="400" y2="600" class="g"/><line x1="500" y1="0" x2="500" y2="600" class="g"/><line x1="600" y1="0" x2="600" y2="600" class="g"/><line x1="700" y1="0" x2="700" y2="600" class="g"/><line x1="800" y1="0" x2="800" y2="600" class="g"/><line x1="900" y1="0" x2="900" y2="600" class="g"/><line x1="1000" y1="0" x2="1000" y2="600" class="g"/><line x1="0" y1="0" x2="1100" y2="0" class="g"/><line x1="0" y1="100" x2="1100" y2="100" class="g"/><line x1="0" y1="200" x2="1100" y2="200" class="g"/><line x1="0" y1="300" x2="1100" y2="300" class="g"/><line x1="0" y1="400" x2="1100" y2="400" class="g"/><line x1="0" y1="500" x2="1100" y2="500" class="g"/></g><text x="50" y="55" class="h">MORPHLE · VISION-GUIDED MICRO-POSITIONING</text><text x="50" y="82" class="s">THE CAMERA CLOSES THE LOOP — IT DOES NOT JUST DETECT THE SAMPLE</text><rect x="55" y="120" width="250" height="170" rx="8" class="b"/><text x="75" y="150" class="s">1 · MICROSCOPE</text><rect x="85" y="170" width="190" height="90" fill="#071014" stroke="#68e1d1"/><circle cx="180" cy="215" r="30" fill="#102a25" stroke="#68e1d1"/><g style="animation:target 15s ease-in-out infinite"><circle cx="180" cy="215" r="10" class="x"/><path d="M160 215h40M180 195v40" stroke="#d6ff45"/></g><rect x="350" y="120" width="250" height="170" rx="8" class="b"/><text x="370" y="150" class="s">2 · OPENCV</text><text x="370" y="185" class="t">target centroid</text><text x="370" y="215" class="t">cx, cy</text><text x="370" y="250" class="m">image center ≠ target</text><rect x="650" y="120" width="395" height="170" rx="8" class="b"/><text x="675" y="150" class="s">3 · CONTROL ERROR</text><text x="675" y="195" class="t">ex = cx − image_center_x</text><text x="675" y="225" class="t">ey = cy − image_center_y</text><circle cx="960" cy="230" r="8" fill="#ff6b6b" style="animation:pulse 15s infinite"/><path d="M895 245h65" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="8 8"/><rect x="270" y="350" width="300" height="120" rx="8" class="b"/><text x="290" y="380" class="s">4 · PID CONTROLLER</text><text x="290" y="410" class="t">error → velocity command</text><text x="290" y="440" class="m">X / Y / Z joint control</text><rect x="650" y="350" width="300" height="120" rx="8" class="b"/><text x="670" y="380" class="s">5 · GANTRY</text><g style="animation:stage 15s ease-in-out infinite"><rect x="700" y="410" width="190" height="14" fill="#263138"/><rect x="775" y="392" width="60" height="50" fill="#172127" stroke="#d6ff45"/><text x="805" y="422" text-anchor="middle" class="t">X/Y/Z</text></g><path d="M305 205H350M600 205H650M800 290V350M570 410H650" stroke="#d6ff45" stroke-width="3" stroke-dasharray="9 9"/><text x="70" y="525" class="m">CAPTURE → SEGMENT/DETECT → CENTROID ERROR → PID → JOINT VELOCITY → CAMERA FEEDBACK</text><text x="70" y="550" class="m">The stage keeps moving until the target converges to the optical center.</text></svg>