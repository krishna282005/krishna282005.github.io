<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600"><style>.bg{fill:#080b0d}.g{stroke:#263138;opacity:.3}.h{fill:#d6ff45;font:bold 25px monospace}.t{fill:#eef3f1;font:14px monospace}.s{fill:#68e1d1;font:12px monospace}.m{fill:#9aa7a5;font:11px monospace}.p{fill:#10181d;stroke:#536169}@keyframes trace{0%,10%{stroke-dashoffset:500}45%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:500}}.trace{stroke-dasharray:500;animation:trace 15s infinite}@keyframes warn{0%,65%{opacity:.1}75%,90%{opacity:1}100%{opacity:.1}}</style><rect width="1100" height="600" class="bg"/><g><line x1="0" y1="0" x2="0" y2="600" class="g"/><line x1="100" y1="0" x2="100" y2="600" class="g"/><line x1="200" y1="0" x2="200" y2="600" class="g"/><line x1="300" y1="0" x2="300" y2="600" class="g"/><line x1="400" y1="0" x2="400" y2="600" class="g"/><line x1="500" y1="0" x2="500" y2="600" class="g"/><line x1="600" y1="0" x2="600" y2="600" class="g"/><line x1="700" y1="0" x2="700" y2="600" class="g"/><line x1="800" y1="0" x2="800" y2="600" class="g"/><line x1="900" y1="0" x2="900" y2="600" class="g"/><line x1="1000" y1="0" x2="1000" y2="600" class="g"/></g><text x="50" y="55" class="h">PreFRTOS · PREDICTIVE FAILURE DETECTION</text><text x="50" y="82" class="s">OBSERVE 500ms OF BEHAVIOR → PREDICT THE NEXT 500ms</text><rect x="55" y="120" width="990" height="350" rx="8" class="p"/><g transform="translate(75 150)"><text class="s">ESP8266 TELEMETRY · ~50ms</text><rect y="25" width="390" height="145" fill="#091013" stroke="#344047"/><path d="M10 135L45 125L80 130L115 105L150 115L185 90L220 105L255 70L290 88L325 45L360 62L385 35" fill="none" stroke="#68e1d1" stroke-width="3" class="trace"/><text y="195" class="m">stack · CPU · task timing · behavior</text></g><g transform="translate(505 165)"><rect width="190" height="115" rx="8" fill="#11191e" stroke="#d6ff45"/><text x="95" y="30" text-anchor="middle" class="s">TEMPORAL WINDOW</text><text x="95" y="62" text-anchor="middle" class="t">10 samples</text><text x="95" y="88" text-anchor="middle" class="m">previous 500 ms</text></g><path d="M465 240H505" stroke="#d6ff45" stroke-width="3" stroke-dasharray="8 8"/><g transform="translate(755 150)"><rect width="235" height="145" rx="8" fill="#11191e" stroke="#536169"/><text x="18" y="30" class="s">MODELS</text><text x="18" y="62" class="t">Random Forest</text><text x="18" y="90" class="t">XGBoost</text><text x="18" y="120" class="m">P(failure next 500ms)</text></g><path d="M695 240H755" stroke="#d6ff45" stroke-width="3" stroke-dasharray="8 8"/><g style="animation:warn 15s infinite"><rect x="700" y="350" width="290" height="75" rx="8" fill="#1b1111" stroke="#ff6b6b" stroke-width="2"/><text x="845" y="380" text-anchor="middle" fill="#ff6b6b" font="bold 15px monospace">EARLY WARNING</text><text x="845" y="405" text-anchor="middle" class="m">timestamp + prediction</text></g><path d="M870 295V350" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="7 7"/><text x="70" y="505" class="m">TELEMETRY → FEATURE WINDOW → RF/XGBOOST → PROBABILITY → WARNING → LATER FAILURE</text><text x="70" y="535" class="m">The value is lead time: the system warns before the failure event actually arrives.</text></svg>