<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600"><style>.bg{fill:#080b0d}.g{stroke:#263138;opacity:.3}.h{fill:#d6ff45;font:bold 25px monospace}.t{fill:#eef3f1;font:14px monospace}.s{fill:#68e1d1;font:12px monospace}.m{fill:#9aa7a5;font:11px monospace}.p{fill:#10181d;stroke:#536169}@keyframes fly{0%,15%{transform:translate(0,0)}35%,55%{transform:translate(100px,35px)}70%,88%{transform:translate(180px,100px)}100%{transform:translate(0,0)}}.fly{animation:fly 15s ease-in-out infinite}@keyframes lock{0%,55%{opacity:.1}65%,85%{opacity:1}100%{opacity:.1}}</style><rect width="1100" height="600" class="bg"/><g><line x1="0" y1="0" x2="0" y2="600" class="g"/><line x1="100" y1="0" x2="100" y2="600" class="g"/><line x1="200" y1="0" x2="200" y2="600" class="g"/><line x1="300" y1="0" x2="300" y2="600" class="g"/><line x1="400" y1="0" x2="400" y2="600" class="g"/><line x1="500" y1="0" x2="500" y2="600" class="g"/><line x1="600" y1="0" x2="600" y2="600" class="g"/><line x1="700" y1="0" x2="700" y2="600" class="g"/><line x1="800" y1="0" x2="800" y2="600" class="g"/><line x1="900" y1="0" x2="900" y2="600" class="g"/><line x1="1000" y1="0" x2="1000" y2="600" class="g"/></g><text x="50" y="55" class="h">SAAHAS · AUTONOMOUS UAV DOCKING</text><text x="50" y="82" class="s">GLOBAL POSITIONING → VISUAL ALIGNMENT → MOVING-PLATFORM RECOVERY</text><rect x="55" y="120" width="990" height="350" rx="8" class="p"/><g transform="translate(90 155)"><text class="s">RTK BASE / ROVER</text><circle cx="70" cy="80" r="42" fill="#0c171b" stroke="#d6ff45"/><path d="M70 42v76M32 80h76" stroke="#d6ff45"/><text x="70" y="150" text-anchor="middle" class="m">cm-level position</text></g><g class="fly"><path d="M350 225l65 -35 65 35-65 35z" fill="#182127" stroke="#d6ff45" stroke-width="3"/><circle cx="365" cy="210" r="15" fill="#0a1013" stroke="#536169"/><circle cx="465" cy="210" r="15" fill="#0a1013" stroke="#536169"/><circle cx="365" cy="240" r="15" fill="#0a1013" stroke="#536169"/><circle cx="465" cy="240" r="15" fill="#0a1013" stroke="#536169"/><text x="415" y="230" text-anchor="middle" class="t">UAV</text></g><path d="M160 235C250 210 300 205 350 215" fill="none" stroke="#d6ff45" stroke-width="3" stroke-dasharray="10 10"/><g transform="translate(690 330)"><rect width="280" height="75" rx="10" fill="#121c21" stroke="#68e1d1"/><rect x="75" y="18" width="130" height="40" fill="#091013" stroke="#536169"/><text x="140" y="43" text-anchor="middle" class="t">MOVING PLATFORM</text></g><path d="M415 260L830 330" stroke="#68e1d1" stroke-width="2" stroke-dasharray="7 8"/><path d="M375 280L440 340h-130z" fill="#d6ff45" opacity=".12"/><g style="animation:lock 15s infinite"><rect x="785" y="290" width="90" height="80" fill="none" stroke="#d6ff45" stroke-width="3"/><path d="M800 330h60M830 305v50" stroke="#d6ff45"/></g><rect x="730" y="150" width="250" height="125" rx="8" class="p"/><text x="750" y="178" class="s">MISSION HANDOFF</text><text x="750" y="207" class="t">RTK / GNSS FOLLOW</text><text x="750" y="232" class="t">↓ DESCEND</text><text x="750" y="257" class="t">↓ VISION LAND</text><text x="70" y="510" class="m">RTK GIVES THE APPROACH → CAMERA FINDS THE PLATFORM → MAVLINK CLOSES CONTROL → ALIGN → LAND</text><text x="70" y="535" class="m">The key idea is the handoff from global navigation to local visual precision.</text></svg>