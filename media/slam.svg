<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600">
<style>
.bg{fill:#080b0d}.grid{stroke:#263138;stroke-width:1;opacity:.35}.box{fill:#10151a;stroke:#445158;stroke-width:2}.node{fill:#eef3f1;font-family:monospace;font-size:13px}.head{fill:#d6ff45;font:bold 24px monospace;letter-spacing:2px}.sub{fill:#68e1d1;font:12px monospace}.flow{stroke:#d6ff45;stroke-width:3;stroke-dasharray:10 12;animation:flow 1.2s linear infinite}.pulse{fill:#d6ff45;animation:pulse 1.5s ease-in-out infinite}.caption{fill:#9aa7a5;font:11px monospace}@keyframes flow{to{stroke-dashoffset:-22}}@keyframes pulse{0%,100%{r:6;opacity:.35}50%{r:11;opacity:1}}@keyframes boxin{0%,10%{opacity:.25;transform:translateY(8px)}25%,85%{opacity:1;transform:translateY(0)}100%{opacity:.25;transform:translateY(-8px)}}g{animation:boxin 15s ease-in-out infinite}
</style>
<rect width="1100" height="600" class="bg"/>
<g opacity=".45"><line x1="0" y1="0" x2="0" y2="600" class="grid"/><line x1="100" y1="0" x2="100" y2="600" class="grid"/><line x1="200" y1="0" x2="200" y2="600" class="grid"/><line x1="300" y1="0" x2="300" y2="600" class="grid"/><line x1="400" y1="0" x2="400" y2="600" class="grid"/><line x1="500" y1="0" x2="500" y2="600" class="grid"/><line x1="600" y1="0" x2="600" y2="600" class="grid"/><line x1="700" y1="0" x2="700" y2="600" class="grid"/><line x1="800" y1="0" x2="800" y2="600" class="grid"/><line x1="900" y1="0" x2="900" y2="600" class="grid"/><line x1="1000" y1="0" x2="1000" y2="600" class="grid"/><line x1="1100" y1="0" x2="1100" y2="600" class="grid"/><line x1="0" y1="0" x2="1100" y2="0" class="grid"/><line x1="0" y1="100" x2="1100" y2="100" class="grid"/><line x1="0" y1="200" x2="1100" y2="200" class="grid"/><line x1="0" y1="300" x2="1100" y2="300" class="grid"/><line x1="0" y1="400" x2="1100" y2="400" class="grid"/><line x1="0" y1="500" x2="1100" y2="500" class="grid"/><line x1="0" y1="600" x2="1100" y2="600" class="grid"/></g>
<text x="55" y="70" class="head">ROS 2 / NAVIGATION</text><text x="55" y="95" class="sub">15s SYSTEM ARCHITECTURE EXPLAINER · DATA FLOW</text>
<line x1="168" y1="300" x2="212" y2="300" class="flow" style="animation-delay:0s"/><line x1="348" y1="300" x2="392" y2="300" class="flow" style="animation-delay:0.35s"/><line x1="528" y1="300" x2="572" y2="300" class="flow" style="animation-delay:0.7s"/><line x1="708" y1="300" x2="752" y2="300" class="flow" style="animation-delay:1.0499999999999998s"/><line x1="888" y1="300" x2="932" y2="300" class="flow" style="animation-delay:1.4s"/><g transform="translate(100,300)"><rect x="-68" y="-34" width="136" height="68" rx="6" class="box"/><text y="-5" text-anchor="middle" class="node">Laser</text><text y="14" text-anchor="middle" class="node">Scan</text></g><g transform="translate(280,300)"><rect x="-68" y="-34" width="136" height="68" rx="6" class="box"/><text y="-5" text-anchor="middle" class="node">SLAM</text><text y="14" text-anchor="middle" class="node">Toolbox</text></g><g transform="translate(460,300)"><rect x="-68" y="-34" width="136" height="68" rx="6" class="box"/><text y="-5" text-anchor="middle" class="node">Map</text><text y="14" text-anchor="middle" class="node">+ Pose</text></g><g transform="translate(640,300)"><rect x="-68" y="-34" width="136" height="68" rx="6" class="box"/><text y="-5" text-anchor="middle" class="node">Nav2</text><text y="14" text-anchor="middle" class="node">Planner</text></g><g transform="translate(820,300)"><rect x="-68" y="-34" width="136" height="68" rx="6" class="box"/><text y="-5" text-anchor="middle" class="node">Controller</text><text y="14" text-anchor="middle" class="node"></text></g><g transform="translate(1000,300)"><rect x="-68" y="-34" width="136" height="68" rx="6" class="box"/><text y="-5" text-anchor="middle" class="node">Robot</text><text y="14" text-anchor="middle" class="node"></text></g>
<circle cx="100" cy="300" r="6" class="pulse" style="animation-delay:0s"/><circle cx="280" cy="300" r="6" class="pulse" style="animation-delay:0.25s"/><circle cx="460" cy="300" r="6" class="pulse" style="animation-delay:0.5s"/><circle cx="640" cy="300" r="6" class="pulse" style="animation-delay:0.75s"/><circle cx="820" cy="300" r="6" class="pulse" style="animation-delay:1s"/><circle cx="1000" cy="300" r="6" class="pulse" style="animation-delay:1.25s"/>
<text x="55" y="515" class="caption">Signal / data moves left → right. Each stage activates as the pipeline progresses.</text>
<text x="55" y="540" class="caption">Krishna Patel · Embedded Systems / Robotics</text>
</svg>