<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600"><style>.bg{fill:#080b0d}.g{stroke:#263138;opacity:.3}.h{fill:#d6ff45;font:bold 25px monospace}.t{fill:#eef3f1;font:14px monospace}.s{fill:#68e1d1;font:12px monospace}.m{fill:#9aa7a5;font:11px monospace}.p{fill:#10181d;stroke:#536169}@keyframes bits{0%,10%{stroke-dashoffset:500}45%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:500}}.bits{stroke-dasharray:12 8;animation:bits 15s linear infinite}@keyframes irq{0%,30%{opacity:.2}38%,55%{opacity:1}65%,100%{opacity:.2}}</style><rect width="1100" height="600" class="bg"/><g><line x1="0" y1="0" x2="0" y2="600" class="g"/><line x1="100" y1="0" x2="100" y2="600" class="g"/><line x1="200" y1="0" x2="200" y2="600" class="g"/><line x1="300" y1="0" x2="300" y2="600" class="g"/><line x1="400" y1="0" x2="400" y2="600" class="g"/><line x1="500" y1="0" x2="500" y2="600" class="g"/><line x1="600" y1="0" x2="600" y2="600" class="g"/><line x1="700" y1="0" x2="700" y2="600" class="g"/><line x1="800" y1="0" x2="800" y2="600" class="g"/><line x1="900" y1="0" x2="900" y2="600" class="g"/><line x1="1000" y1="0" x2="1000" y2="600" class="g"/></g><text x="50" y="55" class="h">STM32F401 · BARE-METAL USART1</text><text x="50" y="82" class="s">WIRE → PERIPHERAL → INTERRUPT → BUFFER → FRAME VALIDATION</text><rect x="55" y="120" width="990" height="350" rx="8" class="p"/><text x="80" y="160" class="s">UART RX</text><path d="M80 220h45v-45h45v45h45v-45h45v45h45v-45h45v45h45v-45h45v45" fill="none" stroke="#68e1d1" stroke-width="4" class="bits"/><text x="80" y="250" class="m">start | data bits | stop</text><g transform="translate(350 160)"><rect width="220" height="120" rx="8" fill="#11191e" stroke="#d6ff45"/><text x="110" y="30" text-anchor="middle" class="s">STM32F401</text><text x="110" y="62" text-anchor="middle" class="t">USART1</text><text x="110" y="88" text-anchor="middle" class="m">BRR / UE / TE / RE</text></g><g transform="translate(650 155)" style="animation:irq 15s infinite"><rect width="200" height="130" rx="8" fill="#10181d" stroke="#d6ff45"/><text x="18" y="28" class="s">ISR</text><text x="18" y="58" class="t">RXNE → read DR</text><text x="18" y="84" class="t">TXE → write DR</text><text x="18" y="110" class="m">ORE → clear</text></g><path d="M300 210H350M570 210H650" stroke="#d6ff45" stroke-width="3" stroke-dasharray="9 9"/><g transform="translate(280 335)"><text class="s">CIRCULAR RX BUFFER</text><rect y="25" width="520" height="55" fill="#091013" stroke="#344047"/><rect x="15" y="38" width="70" height="30" fill="#17252a"/><rect x="90" y="38" width="70" height="30" fill="#17252a"/><rect x="165" y="38" width="70" height="30" fill="#17252a"/><rect x="240" y="38" width="70" height="30" fill="#d6ff45"/><rect x="315" y="38" width="70" height="30" fill="#17252a"/><rect x="390" y="38" width="70" height="30" fill="#17252a"/><text x="260" y="105" text-anchor="middle" class="m">head / tail move independently</text></g><rect x="840" y="335" width="160" height="80" rx="7" fill="#10181d" stroke="#68e1d1"/><text x="920" y="362" text-anchor="middle" class="s">FRAME</text><text x="920" y="390" text-anchor="middle" class="t">LEN | DATA | CRC</text><path d="M800 370H840" stroke="#68e1d1" stroke-width="3" stroke-dasharray="8 8"/><text x="70" y="505" class="m">REGISTER CONFIG → RXNE INTERRUPT → BYTE BUFFER → MESSAGE QUEUE → CRC-32 → APPLICATION</text><text x="70" y="535" class="m">No HAL: the driver owns clocking, GPIO AF7, baud generation, NVIC and USART registers.</text></svg>