<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600"><style>.bg{fill:#080b0d}.g{stroke:#263138;opacity:.3}.h{fill:#d6ff45;font:bold 25px monospace}.t{fill:#eef3f1;font:14px monospace}.s{fill:#68e1d1;font:12px monospace}.m{fill:#9aa7a5;font:11px monospace}.p{fill:#10181d;stroke:#536169}@keyframes pkt{0%,10%{transform:translateX(0);opacity:.2}30%,50%{transform:translateX(350px);opacity:1}65%,85%{transform:translateX(700px);opacity:1}100%{transform:translateX(0);opacity:.2}}.pkt{animation:pkt 15s infinite}</style><rect width="1100" height="600" class="bg"/><g><line x1="0" y1="0" x2="0" y2="600" class="g"/><line x1="100" y1="0" x2="100" y2="600" class="g"/><line x1="200" y1="0" x2="200" y2="600" class="g"/><line x1="300" y1="0" x2="300" y2="600" class="g"/><line x1="400" y1="0" x2="400" y2="600" class="g"/><line x1="500" y1="0" x2="500" y2="600" class="g"/><line x1="600" y1="0" x2="600" y2="600" class="g"/><line x1="700" y1="0" x2="700" y2="600" class="g"/><line x1="800" y1="0" x2="800" y2="600" class="g"/><line x1="900" y1="0" x2="900" y2="600" class="g"/><line x1="1000" y1="0" x2="1000" y2="600" class="g"/></g><text x="50" y="55" class="h">TCP · FILE TRANSFER PROTOCOL</text><text x="50" y="82" class="s">TCP IS A BYTE STREAM — THE APPLICATION MUST CREATE MESSAGE BOUNDARIES</text><rect x="55" y="120" width="990" height="350" rx="8" class="p"/><g transform="translate(75 185)"><rect width="190" height="130" rx="8" fill="#11191e" stroke="#536169"/><text x="95" y="32" text-anchor="middle" class="s">CLIENT</text><text x="95" y="65" text-anchor="middle" class="t">hello.txt</text><text x="95" y="92" text-anchor="middle" class="m">178 bytes</text></g><g transform="translate(835 185)"><rect width="190" height="130" rx="8" fill="#11191e" stroke="#536169"/><text x="95" y="32" text-anchor="middle" class="s">SERVER</text><text x="95" y="65" text-anchor="middle" class="t">recv_exactly()</text><text x="95" y="92" text-anchor="middle" class="m">write to disk</text></g><line x1="265" y1="250" x2="835" y2="250" stroke="#344047" stroke-width="8"/><g class="pkt"><rect x="265" y="220" width="120" height="60" rx="6" fill="#142229" stroke="#68e1d1"/><text x="325" y="245" text-anchor="middle" class="s">METADATA</text><text x="325" y="266" text-anchor="middle" class="m">name + size</text></g><g class="pkt" style="animation-delay:1s"><rect x="265" y="300" width="95" height="45" rx="6" fill="#17251f" stroke="#d6ff45"/><text x="312" y="328" text-anchor="middle" class="t">CHUNK</text></g><g class="pkt" style="animation-delay:2s"><rect x="375" y="300" width="95" height="45" rx="6" fill="#17251f" stroke="#d6ff45"/><text x="422" y="328" text-anchor="middle" class="t">CHUNK</text></g><g class="pkt" style="animation-delay:3s"><rect x="485" y="300" width="95" height="45" rx="6" fill="#17251f" stroke="#d6ff45"/><text x="532" y="328" text-anchor="middle" class="t">CHUNK</text></g><g class="pkt" style="animation-delay:4s"><rect x="595" y="300" width="95" height="45" rx="6" fill="#17251f" stroke="#d6ff45"/><text x="642" y="328" text-anchor="middle" class="t">CHUNK</text></g><path d="M835 380C650 430 430 430 265 380" fill="none" stroke="#68e1d1" stroke-width="3" stroke-dasharray="9 9"/><text x="550" y="445" text-anchor="middle" class="m">ACK / COMPLETION</text><text x="70" y="505" class="m">CONNECT → METADATA → CHUNKS → recv_exactly() → REASSEMBLE → DISK</text><text x="70" y="535" class="m">This is why a TCP send/recv call is not guaranteed to equal one application message.</text></svg>